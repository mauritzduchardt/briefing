<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<title>Briefing</title>
<style>
:root{
  --bg:#fff;--bg2:#f5f5f7;--text:#1d1d1f;--text1:#424245;--text2:#6e6e73;--text3:#86868b;
  --line:rgba(0,0,0,.1);--accent:#0066cc;--pos:#1a7f37;--neg:#c4281c;
  --maxw:680px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --topbar:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:20px;padding-right:20px}
button{font-family:inherit}

/* Kopf */
.head{padding-top:calc(var(--sat) + 26px);padding-bottom:6px}
.eyebrow{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.02em}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:2px 0 0}
.pill{border:0;background:var(--bg2);color:var(--accent);font-size:15px;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}

/* Ressort-Leiste */
.chips{position:sticky;top:var(--topbar);z-index:20;padding-top:var(--sat);background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.chips-inner{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.chips-inner::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--bg2);color:var(--text);font-size:14px;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer;letter-spacing:-.01em;transition:background .2s,color .2s}
.chip.on{background:var(--text);color:#fff}

main{padding-bottom:calc(100px + var(--sab))}
.sec{padding-top:30px;scroll-margin-top:calc(var(--topbar) + var(--sat) + 56px)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 2px}
h2{font-size:24px;line-height:1.17;font-weight:700;letter-spacing:-.025em;margin:0}
.more{font-size:15px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.draft{margin-top:14px;background:var(--bg2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--text2);line-height:1.4;letter-spacing:-.005em}

/* Auf einen Blick */
.glance{list-style:none;margin:6px 0 0;padding:0;counter-reset:g}
.glance li{counter-increment:g;display:flex;gap:14px;padding:12px 0;border-bottom:.5px solid var(--line);cursor:pointer;font-size:17px;line-height:1.38}
.glance li:last-child{border-bottom:0}
.glance li::before{content:counter(g);font-weight:600;color:var(--text3);font-variant-numeric:tabular-nums;min-width:12px}
.glance li:active{opacity:.55}

/* Portfolio-Prognose */
.fc{margin-top:12px;background:var(--bg2);border-radius:16px;display:grid;grid-template-columns:1fr 1fr;cursor:pointer}
.fc-i{padding:14px 16px}
.fc-i+.fc-i{border-left:.5px solid var(--line)}
.fc-s{font-size:12px;font-weight:600;color:var(--text2)}
.fc-l{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;line-height:1.2;margin-top:7px;letter-spacing:-.02em}
.fc-i p{font-size:14px;line-height:1.38;color:var(--text2);margin:7px 0 0;letter-spacing:-.01em}
.arrow{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:600;flex:none}
.arrow.sm{width:24px;height:24px;font-size:13px}
.arrow.pos{background:rgba(26,127,55,.12);color:var(--pos)}
.arrow.neg{background:rgba(196,40,28,.10);color:var(--neg)}
.arrow.neu{background:rgba(0,0,0,.06);color:var(--text2)}

/* Kacheln */
.strip{display:flex;gap:10px;overflow-x:auto;margin:10px -20px 0;padding:0 20px 2px;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tile{flex:none;width:148px;scroll-snap-align:start;background:var(--bg2);border-radius:14px;padding:12px 14px}
.strip .tile{cursor:pointer}
.tile .k{font-size:12px;color:var(--text2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.tile .v{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .n{font-size:12px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.pos{color:var(--pos)}.neg{color:var(--neg)}.neu{color:var(--text2)}

/* Meldungen */
.story{padding:16px 0;border-top:.5px solid var(--line);cursor:pointer}
.story.lead{border-top:0;padding-top:12px}
.story:active{opacity:.55}
.kicker{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px;letter-spacing:-.005em}
.tag{font-size:11px;font-weight:600;color:var(--neg);background:rgba(196,40,28,.08);border-radius:5px;padding:1px 6px;letter-spacing:0}
.story h3{font-size:19px;line-height:1.26;font-weight:600;letter-spacing:-.02em;margin:0}
.story p{margin:6px 0 0;font-size:16px;line-height:1.45;color:var(--text1)}
.story.lead h3{font-size:26px;line-height:1.16;font-weight:700;letter-spacing:-.03em}
.story.lead p{font-size:17px;line-height:1.47;margin-top:8px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px;font-size:13px}
a.src{color:var(--accent);text-decoration:none;font-weight:500;display:inline-flex;align-items:center;gap:3px;font-size:13px}
a.src svg{width:10px;height:10px}

.brief{list-style:none;margin:4px 0 0;padding:0}
.brief li{padding:12px 0;border-bottom:.5px solid var(--line);font-size:16px;line-height:1.45;color:var(--text1)}
.brief li:last-child{border-bottom:0}
.brief .src{margin-left:6px}
.foot{font-size:13px;color:var(--text3);line-height:1.45;padding-top:30px;margin:0}

/* Märkte */
.hero{margin-top:16px;background:var(--bg2);border-radius:18px;padding:18px 20px 6px}
.hero .lbl{font-size:13px;font-weight:600;color:var(--text2)}
.hero .sub{font-size:13px;color:var(--text3);margin-top:1px}
.hz{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:16px 0;border-bottom:.5px solid var(--line)}
.hz:last-child{border-bottom:0}
.hz .when{font-size:13px;font-weight:600;color:var(--text2)}
.hz .tone{font-size:19px;font-weight:600;margin-top:1px;letter-spacing:-.02em}
.hz p{margin:4px 0 0;font-size:16px;line-height:1.45;color:var(--text1)}
.drivers{display:grid;gap:4px}
.dh{font-size:13px;font-weight:600;margin:14px 0 0;text-transform:uppercase;letter-spacing:.02em}
.dl{list-style:none;padding:0;margin:0}
.dl li{position:relative;padding:11px 0 11px 16px;border-bottom:.5px solid var(--line);font-size:16px;line-height:1.45;color:var(--text1)}
.dl li:last-child{border-bottom:0}
.dl li::before{content:"";position:absolute;left:0;top:19px;width:6px;height:6px;border-radius:50%}
.dl.pos li::before{background:var(--pos)}.dl.neg li::before{background:var(--neg)}
.dl .src{margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.grid .tile{width:auto}
.cal .r{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line);font-size:16px;line-height:1.4}
.cal .r:last-child{border-bottom:0}
.cal .w{font-size:15px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums}
.etf{padding:12px 0;border-bottom:.5px solid var(--line)}
.etf:last-child{border-bottom:0}
.etf .i{font-size:13px;color:var(--text3);margin-top:1px;font-variant-numeric:tabular-nums}

/* Archiv & Suche */
.search{position:relative;margin-top:14px}
.search input{width:100%;-webkit-appearance:none;appearance:none;border:0;background:var(--bg2);border-radius:12px;padding:11px 14px 11px 40px;font:inherit;font-size:17px;color:var(--text);outline:none}
.search input::placeholder{color:var(--text3)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3)}
.month{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.02em;margin:26px 0 2px}
.day{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:.5px solid var(--line);cursor:pointer}
.day:active{opacity:.55}
.day .d{font-size:17px;font-weight:600}
.day .t{font-size:15px;color:var(--text2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.chev{color:#c7c7cc;font-size:22px;line-height:1}
.count{font-size:13px;color:var(--text2);margin:18px 0 0;font-weight:600}
.hit{padding:14px 0;border-bottom:.5px solid var(--line);cursor:pointer}
.hit h3{font-size:17px;line-height:1.3;font-weight:600;margin:0;letter-spacing:-.02em}
.hit p{margin:4px 0 0;font-size:15px;line-height:1.42;color:var(--text2)}
.empty{color:var(--text2);font-size:16px;padding:24px 0}
mark{background:rgba(255,204,0,.38);color:inherit;border-radius:3px;padding:0 1px}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding-bottom:var(--sab)}
.tabbar-inner{display:flex;align-items:center;max-width:var(--maxw);margin:0 auto}
.brand{display:none}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10.5px;font-weight:500;color:var(--text3);cursor:pointer;letter-spacing:0}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}

/* Detail-Ansicht */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .28s;z-index:40}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:var(--maxw);margin:0 auto;max-height:calc(100% - var(--sat) - 28px);background:#fff;border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet-top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0}
.grab{position:absolute;left:50%;top:6px;width:36px;height:5px;border-radius:3px;background:#d1d1d6;transform:translateX(-50%)}
.pos-ind{font-size:13px;color:var(--text3);font-variant-numeric:tabular-nums;padding-left:4px}
.sheet-close{border:0;background:none;color:var(--accent);font-size:17px;font-weight:600;padding:6px 4px;cursor:pointer}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px calc(24px + var(--sab));transition:opacity .15s}
.sheet-body.fade{opacity:0}
.sheet-body h3{font-size:28px;line-height:1.14;font-weight:700;letter-spacing:-.03em;margin:4px 0 14px}
.sheet-body .lede{font-size:19px;line-height:1.42;margin:0 0 14px;letter-spacing:-.02em;font-weight:500}
.sheet-body .body{font-size:17px;line-height:1.52;margin:0 0 12px;color:var(--text1)}
.why{margin-top:18px;background:var(--bg2);border-radius:12px;padding:14px 16px}
.why .l{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px}
.why p{margin:0;font-size:16px;line-height:1.45}
.read{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;text-decoration:none;border-radius:12px;padding:13px 16px;font-size:17px;font-weight:600}
.btn svg{width:12px;height:12px}
.btn.alt{background:var(--bg2);color:var(--accent)}
.nav2{display:flex;gap:10px;margin-top:22px;padding-top:16px;border-top:.5px solid var(--line)}
.nb{flex:1;border:0;background:none;text-align:left;cursor:pointer;padding:4px 0;min-width:0}
.nb.r{text-align:right}
.nb .l{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.02em}
.nb .t{font-size:15px;font-weight:600;color:var(--accent);line-height:1.3;margin-top:3px;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nb[disabled]{visibility:hidden}

/* ---------- Mac / breite Bildschirme ---------- */
@media (min-width:900px){
  :root{--maxw:1060px;--topbar:52px}
  body{padding-top:var(--topbar)}
  .wrap{padding-left:32px;padding-right:32px}
  .head{padding-top:36px}
  h1{font-size:40px}
  .tabbar{top:0;bottom:auto;height:var(--topbar);border-top:0;border-bottom:.5px solid var(--line);padding-bottom:0}
  .tabbar-inner{height:100%;padding:0 32px;gap:4px}
  .brand{display:block;margin-right:auto;font-size:17px;font-weight:600;letter-spacing:-.02em}
  .tab{flex:none;flex-direction:row;gap:7px;font-size:14px;padding:7px 14px;border-radius:999px}
  .tab svg{width:18px;height:18px}
  .tab.on{background:var(--bg2);color:var(--text)}
  .tab:hover{color:var(--text)}
  main{padding-bottom:72px}
  .top-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:start}
  .strip{flex-wrap:wrap;overflow:visible;margin:10px 0 0;padding:0}
  .strip .tile{width:calc(33.333% - 7px)}
  .sheet-top{padding:14px 28px 0}
  .stories{display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
  .story.lead{grid-column:1/-1}
  .stories .story:nth-child(2),.stories .story:nth-child(3){border-top:.5px solid var(--line)}
  .story:hover h3{color:var(--accent)}
  .story:active{opacity:1}
  .brief{columns:2;column-gap:48px}
  .brief li{break-inside:avoid}
  .mk-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
  .drivers{grid-template-columns:1fr 1fr;gap:28px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .sheet{top:50%;bottom:auto;left:50%;right:auto;width:680px;max-height:86vh;border-radius:18px;margin:0;transform:translate(-50%,-47%) scale(.98);opacity:0;pointer-events:none;transition:transform .25s ease,opacity .2s ease;box-shadow:0 24px 80px rgba(0,0,0,.18)}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
  .sheet-body{padding:0 32px 28px}
  .nb:hover .t{text-decoration:underline}
  .glance li:hover{color:var(--accent)}
}
/* Native Bedienung */
body{touch-action:manipulation}
.tab,.chip,.pill,.more,.nb,.sheet-close,.glance li,.day,.fc,.tile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.notice{margin-top:14px;background:var(--bg2);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--text1);line-height:1.4}
.ptr{position:fixed;left:0;right:0;top:calc(var(--sat) + var(--topbar) + 8px);display:flex;justify-content:center;pointer-events:none;z-index:25;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
.ptr.on{opacity:1;transform:none}
.ptr span{background:#fff;border:.5px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.08);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--text2)}
.state{padding:70px 0;text-align:center;color:var(--text2);font-size:16px}
.state .pill{margin-top:14px}
.sheet.drag{transition:none}
</style>
</head>
<body>

<header class="head wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <div class="titlerow"><h1 id="title">Briefing</h1><button class="pill" id="backToday" hidden>Zu heute</button></div>
</header>
<nav class="chips" id="chips" hidden><div class="chips-inner wrap" id="chipsInner"></div></nav>
<main class="wrap" id="view"><div class="state">Lädt …</div></main>
<div class="ptr" id="ptr"><span id="ptrText">Zum Aktualisieren ziehen</span></div>

<nav class="tabbar"><div class="tabbar-inner">
  <span class="brand">Briefing</span>
  <button class="tab" data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h10A1.5 1.5 0 0 1 17 5.5V18a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h2.5a.5.5 0 0 1 .5.5V18a2 2 0 0 1-2 2"/><path d="M7.5 8h6M7.5 11.5h6M7.5 15h4"/></svg>Heute</button>
  <button class="tab" data-tab="maerkte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17.5 9 12l3.5 3.5 8-8"/><path d="M15 7.5h5.5V13"/></svg>Märkte</button>
  <button class="tab" data-tab="archiv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 12a8.4 8.4 0 1 0 2.5-6"/><path d="M3.5 3.8v4.4h4.4"/><path d="M12 7.5V12l3 2"/></svg>Archiv</button>
</div></nav>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="sheet-top"><span class="grab"></span><span class="pos-ind" id="posInd"></span><button class="sheet-close" id="sheetClose">Fertig</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<script>
"use strict";
/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])).replace(/(\d) (?=%|€|\$|Mrd|Mio|Bio|Cent|ct)/g, "$1&nbsp;");
const ARROW = {pos:"↗", neg:"↘", neu:"→"};
const EXT = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5h5.5V8M9.5 2.5l-7 7"/></svg>';
const fmt = (date, opt) => new Date(date + "T12:00:00").toLocaleDateString("de-DE", opt);
const links = srcs => (srcs || []).map(s => `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}${EXT}</a>`).join(" ");
const todayBerlin = () => new Date().toLocaleDateString("sv-SE", {timeZone:"Europe/Berlin"});
const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const TABS = ["heute", "maerkte", "archiv"];
const S = {tab:"heute", today:null, day:null, index:[], cache:{}, q:"", sheet:null, search:null, loadedAt:0};
const ordered = d => d.sections.flatMap(sec => d.stories.filter(s => s.section === sec.id));

/* ---------- Daten ---------- */
async function getJSON(path) {
  const r = await fetch(`${path}?v=${Date.now()}`, {cache:"no-store"});
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}
async function loadDay(date, fresh) {
  if (!fresh && S.cache[date]) return S.cache[date];
  const d = await getJSON(`data/${date}.json`);
  S.cache[date] = d;
  return d;
}
/* Holt die neueste Ausgabe; gibt true zurück, wenn sich etwas geändert hat. */
async function refresh(force) {
  const idx = await getJSON("data/index.json");
  const newest = idx[0]?.date;
  if (!newest) throw new Error("keine Ausgaben");
  const changed = newest !== S.today;
  const onToday = !S.day || S.day.date === S.today;
  S.index = idx; S.search = null;
  if (changed || force) {
    S.today = newest;
    const d = await loadDay(newest, true);
    if (onToday) S.day = d;
  }
  S.loadedAt = Date.now();
  return changed;
}

/* ---------- Kopf ---------- */
function setHead(title, eyebrow) {
  $("#title").textContent = title;
  $("#eyebrow").textContent = eyebrow;
  $("#backToday").hidden = !(S.tab === "heute" && S.day && S.day.date !== S.today);
}

/* ---------- Heute ---------- */
const tile = (t, go) => `<div class="tile"${go ? ' data-go="maerkte"' : ""}><div class="k">${esc(t.label)}</div><div class="v ${t.tone || ""}">${esc(t.value)}</div><div class="n">${esc(t.note || " ")}</div></div>`;
const tag = s => s.ongoing ? '<span class="tag">Laufende Lage</span>' : "";
const storyHTML = (s, lead) => `<article class="story${lead ? " lead" : ""}" data-story="${esc(s.id)}">
    <div class="kicker">${esc(s.kicker)}${tag(s)}</div><h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p><div class="meta">${links(s.sources)}</div></article>`;
function updatedLine(d) {
  if (!d.meta?.generated) return "";
  const t = new Date(d.meta.generated);
  return `Erstellt am ${t.toLocaleDateString("de-DE", {day:"numeric", month:"long", timeZone:"Europe/Berlin"})} um ${t.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit", timeZone:"Europe/Berlin"})} Uhr.`;
}

function renderHeute() {
  const d = S.day, m = d.markets;
  setHead("Briefing", fmt(d.date, {weekday:"long", day:"numeric", month:"long", year: d.date === S.today ? undefined : "numeric"}));
  const chips = [["blick", "Überblick"], ["maerkte", "Portfolio"]];
  let h = "";
  if (d.date === S.today && S.today !== todayBerlin())
    h += `<div class="notice">Die heutige Ausgabe ist noch nicht da – das ist die neueste vom ${esc(fmt(d.date, {weekday:"long", day:"numeric", month:"long"}))}.</div>`;
  h += `<div class="top-grid">
    <section class="sec" id="sec-blick"><div class="sec-h"><h2>Auf einen Blick</h2></div>
      <ol class="glance">${d.glance.map(g => `<li data-story="${esc(g.story)}">${esc(g.text)}</li>`).join("")}</ol></section>
    <section class="sec" id="sec-maerkte"><div class="sec-h"><h2>Dein Portfolio</h2><button class="more" data-go="maerkte">Details</button></div>
      <div class="fc" data-go="maerkte">${m.forecast.map(f => `<div class="fc-i"><div class="fc-s">${esc(f.horizon)}</div>
        <div class="fc-l ${f.tone}"><span class="arrow sm ${f.tone}">${ARROW[f.tone]}</span>${esc(f.label)}</div><p>${esc(f.text)}</p></div>`).join("")}</div>
      <div class="strip">${m.indicators.map(t => tile(t, true)).join("")}</div></section>
  </div>`;
  for (const sec of d.sections) {
    const list = d.stories.filter(s => s.section === sec.id);
    if (!list.length) continue;
    chips.push([sec.id, sec.label]);
    h += `<section class="sec" id="sec-${sec.id}"><div class="sec-h"><h2>${esc(sec.label)}</h2></div><div class="stories">${list.map((s, i) => storyHTML(s, i === 0)).join("")}</div></section>`;
  }
  if (d.brief?.length) {
    chips.push(["kurz", "Kurz notiert"]);
    h += `<section class="sec" id="sec-kurz"><div class="sec-h"><h2>Kurz notiert</h2></div>
          <ul class="brief">${d.brief.map(b => `<li>${esc(b.text)}${links(b.sources)}</li>`).join("")}</ul></section>`;
  }
  h += `<p class="foot">${esc(updatedLine(d))}${d.meta?.note ? "<br>" + esc(d.meta.note) : ""}<br>Keine Anlageberatung.</p>`;
  view.innerHTML = h;
  $("#chipsInner").innerHTML = chips.map(([id, l]) => `<button class="chip" data-chip="${id}">${esc(l)}</button>`).join("");
  observeSections();
}
let io;
function observeSections() {
  io?.disconnect();
  io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const id = e.target.id.slice(4);
      document.querySelectorAll(".chip").forEach(c => {
        const on = c.dataset.chip === id;
        c.classList.toggle("on", on);
        if (on) $("#chipsInner").scrollTo({left: c.offsetLeft - 20, behavior:"smooth"});
      });
    });
  }, {rootMargin:"-120px 0px -70% 0px"});
  document.querySelectorAll("main .sec").forEach(s => io.observe(s));
}

/* ---------- Märkte ---------- */
function renderMaerkte() {
  const d = S.day, m = d.markets;
  setHead("Märkte", fmt(d.date, {weekday:"long", day:"numeric", month:"long"}));
  const li = x => `<li>${esc(x.text)}${links(x.sources)}</li>`;
  const hz = o => `<div class="hz"><span class="arrow ${o.tone}">${ARROW[o.tone]}</span>
      <div><div class="when">${esc(o.horizon)}</div><div class="tone ${o.tone}">${esc(o.label)}</div><p>${esc(o.text)}</p>${o.sources?.length ? `<div class="meta">${links(o.sources)}</div>` : ""}</div></div>`;
  view.innerHTML = `
  <div class="mk-grid">
    <div>
      <div class="hero">
        <div class="lbl">Prognose für dein Portfolio</div>
        <div class="sub">${esc(m.portfolio)}</div>
        ${m.forecast.map(hz).join("")}
      </div>
      <section class="sec"><h2>Lage der letzten Tage</h2>
        ${hz({horizon:"Aktuell", tone:m.status.tone, label:m.status.label, text:m.status.text, sources:m.status.sources})}
      </section>
      <section class="sec"><h2>Weiterer Ausblick</h2>${m.outlook.map(hz).join("")}</section>
    </div>
    <div>
      <section class="sec"><h2>Treiber</h2>
        <div class="drivers">
          <div><div class="dh pos">Rückenwind</div><ul class="dl pos">${m.tailwinds.map(li).join("")}</ul></div>
          <div><div class="dh neg">Gegenwind</div><ul class="dl neg">${m.headwinds.map(li).join("")}</ul></div>
        </div>
      </section>
      <section class="sec"><h2>Termine</h2><div class="cal">${m.calendar.map(c => `<div class="r"><div class="w">${esc(c.when)}</div><div>${esc(c.text)}</div></div>`).join("")}</div></section>
    </div>
  </div>
  <section class="sec"><h2>Kennzahlen</h2><div class="grid">${m.indicators.map(t => tile(t)).join("")}</div></section>
  <section class="sec"><h2>Deine ETFs</h2>${m.etfs.map(e => `<div class="etf"><div>${esc(e.name)}</div><div class="i">${esc(e.isin)}</div></div>`).join("")}</section>
  <p class="foot">Prognosen sind Einschätzungen auf Basis der Nachrichtenlage, keine Anlageberatung.</p>`;
}

/* ---------- Archiv & Suche ---------- */
function renderArchiv() {
  setHead("Archiv", `${S.index.length} ${S.index.length === 1 ? "Ausgabe" : "Ausgaben"}`);
  view.innerHTML = `<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>
    <input id="q" type="search" placeholder="In allen Briefings suchen" autocomplete="off" autocorrect="off" enterkeyhint="search" value="${esc(S.q)}"></div><div id="res"></div>`;
  const q = $("#q");
  q.addEventListener("input", () => { S.q = q.value; renderResults(); });
  q.addEventListener("keydown", e => { if (e.key === "Enter") q.blur(); });
  renderResults();
}
function hl(text, words) {
  if (!words.length) return esc(text);
  const re = new RegExp("(" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return String(text).split(re).map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join("");
}
async function renderResults() {
  const res = $("#res"); if (!res) return;
  const q = S.q.trim();
  if (!q) {
    let h = "", month = "";
    for (const i of S.index) {
      const mo = fmt(i.date, {month:"long", year:"numeric"});
      if (mo !== month) { h += `<div class="month">${esc(mo)}</div>`; month = mo; }
      h += `<div class="day" data-day="${esc(i.date)}"><div><div class="d">${esc(fmt(i.date, {weekday:"long", day:"numeric", month:"long"}))}</div><div class="t">${esc(i.top)}</div></div><span class="chev">›</span></div>`;
    }
    res.innerHTML = h;
    return;
  }
  if (!S.search) {
    try { S.search = await getJSON("data/search.json"); }
    catch (e) { res.innerHTML = `<div class="empty">Suche gerade nicht verfügbar.</div>`; return; }
  }
  if (S.q.trim() !== q) return;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const match = parts => { const hay = parts.join(" ").toLowerCase(); return words.every(w => hay.includes(w)); };
  const hits = [];
  for (const e of S.search) {
    const dl = fmt(e.d, {day:"numeric", month:"short", year:"numeric"});
    if (e.b) {
      if (match([e.t, ...(e.src || []).map(x => x.name)]))
        hits.push(`<div class="hit" style="cursor:default"><div class="kicker">${esc(dl)} · Kurz notiert</div><p style="color:var(--text)">${hl(e.t, words)} ${links(e.src)}</p></div>`);
    } else if (match([e.t, e.m, e.x, e.k, e.s, e.q])) {
      hits.push(`<div class="hit" data-story="${esc(e.id)}" data-date="${esc(e.d)}"><div class="kicker">${esc(dl)} · ${esc(e.s)}</div><h3>${hl(e.t, words)}</h3><p>${hl(e.m, words)}</p></div>`);
    }
    if (hits.length >= 150) break;
  }
  res.innerHTML = hits.length
    ? `<div class="count">${hits.length >= 150 ? "Über 150" : hits.length} Treffer</div>${hits.join("")}`
    : `<div class="empty">Keine Treffer für „${esc(q)}“.</div>`;
}

/* ---------- Detail-Ansicht ---------- */
const sheet = $("#sheet"), sheetBody = $("#sheetBody");
function fillSheet() {
  const {d, list, i} = S.sheet, s = list[i];
  const sec = d.sections.find(x => x.id === s.section)?.label || "";
  const prev = list[i - 1], next = list[i + 1];
  $("#posInd").textContent = `${i + 1} von ${list.length}`;
  sheetBody.innerHTML = `
    <div class="kicker">${esc(sec)} · ${esc(s.kicker)}${tag(s)}</div>
    <h3>${esc(s.title)}</h3>
    <p class="lede">${esc(s.summary)}</p>
    ${(s.details || []).map(p => `<p class="body">${esc(p)}</p>`).join("")}
    ${s.why ? `<div class="why"><div class="l">Was das bedeutet</div><p>${esc(s.why)}</p></div>` : ""}
    <div class="read">${(s.sources || []).map((x, j) => `<a class="btn${j ? " alt" : ""}" href="${esc(x.url)}" target="_blank" rel="noopener">Bei ${esc(x.name)} lesen ${EXT}</a>`).join("")}</div>
    <div class="nav2">
      <button class="nb" data-step="-1" ${prev ? "" : "disabled"}><div class="l">‹ Zurück</div><div class="t">${esc(prev?.title || "")}</div></button>
      <button class="nb r" data-step="1" ${next ? "" : "disabled"}><div class="l">Nächste ›</div><div class="t">${esc(next?.title || "")}</div></button>
    </div>
    <p class="foot" style="padding-top:16px">${esc(fmt(d.date, {weekday:"long", day:"numeric", month:"long", year:"numeric"}))}</p>`;
  sheetBody.scrollTop = 0;
}
async function openStory(id, date) {
  let d = S.day;
  if (date) { try { d = await loadDay(date); } catch (e) { return; } }
  const list = d ? ordered(d) : [];
  const i = list.findIndex(x => x.id === id);
  if (i < 0) return;
  S.sheet = {d, list, i};
  fillSheet();
  sheet.style.transform = "";
  sheet.classList.add("on"); sheet.setAttribute("aria-hidden", "false");
  $("#backdrop").classList.add("on");
  document.body.style.overflow = "hidden";
}
function step(dir) {
  if (!S.sheet) return;
  const n = S.sheet.i + dir;
  if (n < 0 || n >= S.sheet.list.length) return;
  sheetBody.classList.add("fade");
  setTimeout(() => { S.sheet.i = n; fillSheet(); sheetBody.classList.remove("fade"); }, 140);
}
function closeStory() {
  S.sheet = null;
  sheet.classList.remove("drag");
  sheet.style.transform = "";
  sheet.classList.remove("on"); sheet.setAttribute("aria-hidden", "true");
  $("#backdrop").classList.remove("on");
  document.body.style.overflow = "";
}
/* Gesten: links/rechts = blättern, nach unten ziehen = schließen */
let g = null;
sheet.addEventListener("touchstart", e => {
  const t = e.touches[0];
  g = {x:t.clientX, y:t.clientY, mode:null, dy:0, atTop: sheetBody.scrollTop <= 0 || e.target.closest(".sheet-top")};
}, {passive:true});
sheet.addEventListener("touchmove", e => {
  if (!g) return;
  const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
  if (!g.mode && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) g.mode = Math.abs(dx) > Math.abs(dy) ? "h" : (dy > 0 && g.atTop ? "down" : "scroll");
  if (g.mode === "down" && innerWidth < 900) {
    g.dy = Math.max(0, dy);
    sheet.classList.add("drag");
    sheet.style.transform = `translateY(${g.dy}px)`;
    if (e.cancelable) e.preventDefault();
  }
}, {passive:false});
sheet.addEventListener("touchend", e => {
  if (!g) return;
  const t = e.changedTouches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
  if (g.mode === "h" && Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) step(dx < 0 ? 1 : -1);
  if (g.mode === "down") {
    sheet.classList.remove("drag");
    if (g.dy > 110) closeStory(); else sheet.style.transform = "";
  }
  g = null;
}, {passive:true});

/* ---------- Ziehen zum Aktualisieren (App auf dem Home-Bildschirm) ---------- */
let p = null;
const ptr = $("#ptr"), ptrText = $("#ptrText");
if (standalone) {
  addEventListener("touchstart", e => { if (!S.sheet && scrollY <= 0) p = {y:e.touches[0].clientY, dy:0}; }, {passive:true});
  addEventListener("touchmove", e => {
    if (!p) return;
    p.dy = e.touches[0].clientY - p.y;
    if (p.dy > 20) { ptr.classList.add("on"); ptrText.textContent = p.dy > 90 ? "Loslassen zum Aktualisieren" : "Zum Aktualisieren ziehen"; }
    else ptr.classList.remove("on");
  }, {passive:true});
  addEventListener("touchend", async () => {
    if (!p) return;
    const go = p.dy > 90; p = null;
    if (!go) { ptr.classList.remove("on"); return; }
    ptrText.textContent = "Aktualisiere …";
    try { await refresh(true); render(); ptrText.textContent = "Aktuell"; }
    catch (e) { ptrText.textContent = "Keine Verbindung"; }
    setTimeout(() => ptr.classList.remove("on"), 900);
  }, {passive:true});
}

/* ---------- Navigation ---------- */
function render() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === S.tab));
  $("#chips").hidden = S.tab !== "heute";
  if (S.tab === "heute") renderHeute();
  else if (S.tab === "maerkte") renderMaerkte();
  else renderArchiv();
}
function setTab(t) {
  if (location.hash.slice(1) === t || (t === "heute" && !location.hash)) { S.tab = t; render(); window.scrollTo(0, 0); }
  else location.hash = t;
}
async function showDay(date) {
  try { S.day = await loadDay(date); } catch (e) { return; }
  setTab("heute"); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const st2 = e.target.closest("[data-step]"); if (st2) return step(+st2.dataset.step);
  const tab = e.target.closest("[data-tab]"); if (tab) return setTab(tab.dataset.tab);
  const go = e.target.closest("[data-go]"); if (go) return setTab(go.dataset.go);
  const st = e.target.closest("[data-story]"); if (st) return openStory(st.dataset.story, st.dataset.date);
  const day = e.target.closest("[data-day]"); if (day) return showDay(day.dataset.day);
  const chip = e.target.closest("[data-chip]"); if (chip) return document.getElementById("sec-" + chip.dataset.chip)?.scrollIntoView({behavior:"smooth"});
});
$("#backdrop").addEventListener("click", closeStory);
$("#sheetClose").addEventListener("click", closeStory);
$("#backToday").addEventListener("click", () => showDay(S.today));
document.addEventListener("keydown", e => {
  if (!S.sheet) return;
  if (e.key === "Escape") closeStory();
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});
addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (TABS.includes(h)) { S.tab = h; render(); window.scrollTo(0, 0); }
});
/* Beim Zurückkehren in die App automatisch die neueste Ausgabe holen */
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || Date.now() - S.loadedAt < 60000) return;
  try { if (await refresh(false) && !S.sheet) render(); } catch (e) {}
});

async function boot() {
  view.innerHTML = '<div class="state">Lädt …</div>';
  try { await refresh(true); }
  catch (e) {
    $("#eyebrow").textContent = "";
    view.innerHTML = '<div class="state">Das Briefing konnte nicht geladen werden.<br><button class="pill" id="retry">Erneut versuchen</button></div>';
    $("#retry").onclick = boot;
    return;
  }
  const h = location.hash.slice(1);
  S.tab = TABS.includes(h) ? h : "heute";
  render();
}
boot();
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }
</script>
</body>
</html>
